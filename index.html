<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>UV Eventz ERP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/lucide@latest"></script></head><body class="auth-locked"><section id="authScreen" class="auth-screen"><div class="auth-card"><img class="logo" src="https://iili.io/nG0wCas.md.jpg" alt="UV Eventz"><div class="eyebrow">BUSINESS WORKSPACE</div><h1>Welcome back</h1><p class="muted">Sign in to manage your real UV Eventz records.</p><form id="loginForm"><label>Email address<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn gold full" type="submit">Sign in securely</button><p id="authMessage" role="status"></p></form><small class="muted">Access is limited to authorized workspace members.</small></div></section><div class="shell"><aside class="sidebar"><div class="brand"><img src="https://iili.io/nG0wCas.md.jpg" alt=""><div><b>UV EVENTZ</b><small>BUSINESS SUITE</small></div></div><div class="eyebrow">WORKSPACE</div><nav id="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="enquiries">Enquiries</button><button data-page="customers">Customers</button><button data-page="events">Events</button><button data-page="quotations">Quotations</button><button data-page="invoices">Invoices</button><button data-page="transactions">Transactions</button><button data-page="follow_ups">Follow-ups</button></nav><button id="logout" class="logout">Sign out</button></aside><main><header><div><div id="eyebrow" class="eyebrow">OVERVIEW</div><h1 id="title">
